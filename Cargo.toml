[workspace]
members = [
    "crates/nvstraps-core",
    "crates/nvstraps-deploy",
    "crates/nvstraps-ffs",
    "crates/nvstraps-legacy",
    "crates/nvstraps-uefi",
    "src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
