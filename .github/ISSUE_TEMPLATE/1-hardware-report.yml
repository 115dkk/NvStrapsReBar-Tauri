name: Hardware report
description: Report a trial on a real motherboard, whether it worked or not.
title: "Hardware report: <motherboard> + <GPU>: <works / fails>"
body:
  - type: markdown
    attributes:
      value: |
        A failed trial helps as much as a working one. [Issue #39](https://github.com/115dkk/NvStrapsReBar-Tauri/issues/39) is a complete example.

        Do not attach BIOS images or dumps; the hashes are enough. 한국어로 작성해도 됩니다.
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - "Works: BAR1 is larger than 256 MiB after configuring"
        - "Partly works: details below"
        - "The vendor flasher refused the image"
        - "Flashed, but the PC did not POST and needed recovery"
        - "Boots, but the driver status or the BAR1 size is wrong"
        - "Not finished yet: I will update this issue"
    validations:
      required: true
  - type: input
    id: motherboard
    attributes:
      label: Motherboard
      placeholder: "MSI MAG B660 TOMAHAWK WIFI (DDR5), MS-7D41"
    validations:
      required: true
  - type: input
    id: bios
    attributes:
      label: BIOS version
      description: The official image you started from.
      placeholder: "7D41vAO (E7D41IMS.AO0, 2026-09-07)"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: "RTX 2060 12GB (TU106, 10DE:1F03, subsystem 10DE:1629)"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "Intel Core i5-12400F"
  - type: input
    id: nvidia-driver
    attributes:
      label: NVIDIA driver version
      placeholder: "610.62"
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2 (26100.4061)"
  - type: dropdown
    id: board-type
    attributes:
      label: Board type
      description: Does BIOS setup have a Re-Size BAR item?
      options:
        - "Has Re-Size BAR"
        - "Only Above 4G Decoding: an older board, extra patches may apply"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: bios-settings
    attributes:
      label: BIOS settings
      description: Check them in BIOS setup after flashing; flashing often resets them.
      options:
        - label: Above 4G Decoding is on
        - label: CSM is off
        - label: Re-Size BAR is on (boards that have the item)
  - type: textarea
    id: artifact
    attributes:
      label: What you flashed
      value: |
        - App release and route (guided or ffs inject):
        - Extra patches (older boards):
        - Original image SHA-256:
        - Flashed image SHA-256:
        - Cross-check (UEFITool, UEFIExtract):
  - type: dropdown
    id: flash-route
    attributes:
      label: Flash route
      options:
        - "Flasher in the BIOS setup (M-FLASH, EZ Flash, Q-Flash and similar)"
        - "USB BIOS Flashback button"
        - "Vendor tool in Windows"
        - "External SPI programmer (CH341A or similar)"
        - "Other: details below"
    validations:
      required: true
  - type: textarea
    id: flash-details
    attributes:
      label: Flash details
      description: What the flasher said, and any recovery you needed.
      placeholder: "M-FLASH accepted the full image and finished without errors. No programmer needed."
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Copy the driver status as the app shows it.
      value: |
        - First boot (POST OK / no POST):
        - Driver status before configuring:
        - BAR Settings saved:
        - Driver status after the restart:
        - BAR1 size (app, GPU-Z or nvidia-smi):
    validations:
      required: true
  - type: dropdown
    id: sleep
    attributes:
      label: Sleep and resume (S3)
      description: Sleep, wake, and read the BAR1 size again.
      options:
        - "Not tested"
        - "Works: BAR1 is still expanded after waking"
        - "Wakes, but BAR1 is back to 256 MiB"
        - "Does not wake, or crashes on waking"
        - "This PC has no S3 sleep"
    validations:
      required: true
  - type: dropdown
    id: per-game
    attributes:
      label: Per-game switches
      options:
        - "Not tested"
        - "Work: the driver reads back the change"
        - "Do not work: details below"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, logs from `%LOCALAPPDATA%\io.github.nvstrapsrebar.desktop\logs`, recovery steps.
  - type: checkboxes
    id: credit
    attributes:
      label: Credit
      options:
        - label: You may thank me by my GitHub name in the README
