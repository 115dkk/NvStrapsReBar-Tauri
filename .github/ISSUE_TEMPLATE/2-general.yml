name: Bug, question or idea
description: Anything that is not a report of a trial on a real board.
body:
  - type: markdown
    attributes:
      value: |
        Flashed a board? Use **Hardware report** instead. Report security problems [privately](https://github.com/115dkk/NvStrapsReBar-Tauri/security/advisories/new), not here. 한국어로 작성해도 됩니다.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - "Bug in the app"
        - "Bug in the UEFI driver"
        - "Question"
        - "Idea or feature request"
        - "Documentation"
        - "Other"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App release
      description: Shown in Windows Settings > Apps.
      placeholder: "1.0.1"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: For a question or idea, write it here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open BAR Settings
        2. ...
  - type: textarea
    id: system
    attributes:
      label: System
      description: Fill in what applies.
      placeholder: |
        - Motherboard and BIOS version:
        - GPU:
        - NVIDIA driver:
        - Windows version:
        - Driver status shown in the app:
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Logs are in `%LOCALAPPDATA%\io.github.nvstrapsrebar.desktop\logs`. Do not attach BIOS images or dumps.
