name: Bug, question or idea
description: Anything that is not a report of a trial on a real board.
body:
  - type: markdown
    attributes:
      value: |
        Flashed a board, or tried to? Use the **Hardware report** form instead, so the result lands next to the others.

        Report a security problem privately through [GitHub's private vulnerability reporting](https://github.com/115dkk/NvStrapsReBar-Tauri/security/advisories/new), as [SECURITY.md](https://github.com/115dkk/NvStrapsReBar-Tauri/blob/master/SECURITY.md) explains, not in a public issue.

        한국어로 작성해도 됩니다.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - "Bug in the app"
        - "Bug in the UEFI driver"
        - "Question"
        - "Idea or feature request"
        - "Documentation"
        - "Other"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App release
      description: The release you downloaded, from the release page or Windows Settings > Apps.
      placeholder: "1.0.1"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: For a question or idea, write it here.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open BAR Settings
        2. ...
  - type: textarea
    id: system
    attributes:
      label: System
      description: Fill in what applies.
      placeholder: |
        - Motherboard and BIOS version:
        - GPU:
        - NVIDIA driver:
        - Windows version:
        - Driver status shown in the app:
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: >-
        The app writes its logs to `%LOCALAPPDATA%\io.github.nvstrapsrebar.desktop\logs`:
        `panic.log` if the app crashed, `driver-settings.log` for the per-game switches.
        Leave out serial numbers, the Windows product key and anything else that identifies you.
        Do not attach a BIOS image: a dump read with a programmer holds the board's serial number
        and MAC address, and an official image may not be yours to share.
