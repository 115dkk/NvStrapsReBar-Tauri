name: Linux repository

# Builds the apt repository from the .deb and the dnf repository from the .rpm of every published
# release that carries them, signs both with the project's package key and publishes them on
# GitHub Pages. The Release workflow calls it after it has published a release; it can also be
# started by hand from master, which publishes the repositories again from the releases that
# exist.
#
# The packages come from the releases and from the pre-releases tagged
# linux-preview-<version> that carried the Linux build up to 1.1.9. The repositories are built
# from nothing each time: what they offer is exactly the packages on the releases page, and
# nothing is kept between runs.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NVSTRAPS_RPM_SIGNING_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: linux-repository
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign the apt and dnf repositories
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Require the package signing key
        env:
          NVSTRAPS_RPM_SIGNING_KEY: ${{ secrets.NVSTRAPS_RPM_SIGNING_KEY }}
        run: |
          # apt and dnf refuse a repository without a signature, so an unsigned one is not published.
          if [ -z "${NVSTRAPS_RPM_SIGNING_KEY}" ]; then
            echo "The NVSTRAPS_RPM_SIGNING_KEY secret is missing" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils gnupg rpm createrepo-c dnf
      - name: Download the packages of every published release that carries them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/release-packages
          # A draft has no tag yet, so it is left out; a release without a .deb is a Windows-only
          # release from the time the Linux build went out as a pre-release.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | select(any(.assets[]; .name | endswith(".deb"))) | .tag_name' \
            >target/releases.txt
          [ -s target/releases.txt ] || { echo "No release carries a .deb" >&2; exit 1; }
          while read -r tag; do
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern '*.deb' --pattern '*.rpm' --dir target/release-packages --skip-existing
          done <target/releases.txt
          ls -l target/release-packages
      - name: Build the repositories
        run: |
          bash scripts/build-apt-repository.sh target/repository-site docs/RPM-GPG-KEY-nvstraps-rebar target/release-packages/*.deb
          bash scripts/build-dnf-repository.sh target/repository-site docs/RPM-GPG-KEY-nvstraps-rebar target/release-packages/*.rpm
      - name: Sign the repositories with the project key and check them with apt and dnf
        # Only this step sees the key.
        env:
          NVSTRAPS_RPM_SIGNING_KEY: ${{ secrets.NVSTRAPS_RPM_SIGNING_KEY }}
        run: |
          bash scripts/sign-apt-repository.sh target/repository-site
          bash scripts/sign-dnf-repository.sh target/repository-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/repository-site

  deploy:
    name: Publish the repositories on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
