name: Tauri application

# Pull requests carry the validation; a master push only releases (Release.yml), and the release
# gate accepts the pull request's runs of this workflow as the evidence for what ships.
on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Decide whether heavy CI is required
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ steps.scope.outputs.run-heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        name: Classify the change
        env:
          CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_SCOPE_TEXT: ${{ github.event.pull_request.title || '' }}
        run: node tools/ci-scope.mjs

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check Markdown links and issue forms
        run: npm run check:docs
      - name: Test the CI, documentation and release tooling
        run: npm run check:ci-scope

  frontend:
    name: Frontend and browser checks
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  native-windows:
    name: Rust backend and Windows shell
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Enforce the Rust-only source boundary
        run: npm run check:riir
      - name: Build the Rust UEFI resource required by the Tauri manifest
        run: npm run build:firmware
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Check no_std core
        run: cargo check -p nvstraps-core --no-default-features
      - name: Build native application
        run: npm run tauri:ci
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

  # Drives the real application, not the browser preview, through the guided deployment with retail
  # vendor BIOS images. Only the machine's hardware, firmware variables, reboots and nvidia-smi are
  # simulated (docs/REAL_APP_E2E.md). The archives stay in the Actions cache; no step uploads an
  # image, an archive or a file the application derived from one.
  real-app:
    name: Real app with vendor firmware
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: real-app
      - name: Install dependencies
        run: npm ci
      - name: Restore vendor firmware archives
        uses: actions/cache@v6
        with:
          path: .cache/vendor-firmware/archives
          key: vendor-firmware-${{ hashFiles('tests/real-app/vendor-firmware.json') }}
      - name: Download and verify vendor firmware
        run: node tools/fetch-vendor-firmware.mjs
      - name: Build the application on a simulated machine
        run: npm run tauri:simulated
      - name: Drive the real application
        run: npm run test:real-app
      - name: Upload screenshots and logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: real-app-diagnostics
          path: |
            test-results/real-app/**/*.png
            test-results/real-app/**/*.log
          if-no-files-found: ignore
          retention-days: 7
