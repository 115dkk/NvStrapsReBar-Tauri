name: Tauri application

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  native-windows:
    name: Rust backend and Windows shell
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Enforce the Rust-only source boundary
        run: npm run check:riir
      - name: Build the Rust UEFI resource required by the Tauri manifest
        run: npm run build:firmware
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Check no_std core
        run: cargo check -p nvstraps-core --no-default-features
      - name: Build native application
        run: npm run tauri:ci
      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: NvStrapsReBar-windows
          path: |
            target/release/NvStrapsReBar.exe
            target/release/NvStrapsReBar.ffs
          if-no-files-found: error
