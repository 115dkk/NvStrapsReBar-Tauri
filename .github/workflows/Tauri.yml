name: Tauri application

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Decide whether heavy CI is required
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ steps.scope.outputs.run-heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        name: Classify the change
        env:
          CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_TEXT: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
        run: node tools/ci-scope.mjs

  frontend:
    name: Frontend and browser checks
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  native-windows:
    name: Rust backend and Windows shell
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Enforce the Rust-only source boundary
        run: npm run check:riir
      - name: Build the Rust UEFI resource required by the Tauri manifest
        run: npm run build:firmware
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Check no_std core
        run: cargo check -p nvstraps-core --no-default-features
      - name: Build native application
        run: npm run tauri:ci
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Inno Setup installer hash mismatch' }
          Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$env:RUNNER_TEMP\InnoSetup7" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\InnoSetup7\ISCC.exe")) { throw 'ISCC.exe was not installed' }
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          & "$env:RUNNER_TEMP\InnoSetup7\ISCC.exe" /Qp "/DAppVersion=$version" "/DOutputDir=..\target\release" installer/NvStrapsReBar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Upload native executable
        uses: actions/upload-artifact@v7
        with:
          name: NvStrapsReBar-windows
          path: |
            target/release/NvStrapsReBar.exe
            target/release/NvStrapsReBar.ffs
            target/release/NvStrapsReBar-windows-x64-setup.exe
          if-no-files-found: error

  prerelease:
    name: Publish Windows pre-release
    needs: [frontend, native-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: NvStrapsReBar-windows
          path: release-files
      - name: Package portable Windows application
        working-directory: release-files
        run: |
          test -s NvStrapsReBar.exe
          test -s NvStrapsReBar.ffs
          test -s NvStrapsReBar-windows-x64-setup.exe
          zip NvStrapsReBar-windows-x64.zip NvStrapsReBar.exe NvStrapsReBar.ffs
          sha256sum NvStrapsReBar-windows-x64.zip NvStrapsReBar-windows-x64-setup.exe > SHA256SUMS.txt
      - name: Publish this commit as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-prerelease.mjs
