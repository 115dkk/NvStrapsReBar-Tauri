name: Tauri application

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# Master pushes queue behind each other so two releases never race for the same version.
concurrency:
  group: tauri-${{ github.event_name == 'push' && 'master-release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Decide whether heavy CI and a release are required
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ steps.scope.outputs.run-heavy }}
      release: ${{ steps.release.outputs.release }}
      release-level: ${{ steps.release.outputs.level }}
      release-version: ${{ steps.release.outputs.version }}
      release-tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        name: Classify the change
        env:
          CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_TEXT: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
        run: node tools/ci-scope.mjs
      - id: release
        name: Plan the release
        env:
          RELEASE_PLAN_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PLAN_REF: ${{ github.ref }}
          RELEASE_PLAN_BASE_SHA: ${{ github.event.before }}
          RELEASE_PLAN_HEAD_SHA: ${{ github.sha }}
        run: node tools/release-plan.mjs

  frontend:
    name: Frontend and browser checks
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, unit test, and build
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        run: npm run test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  native-windows:
    name: Rust backend, Windows shell and release
    needs: [scope, frontend]
    if: needs.scope.outputs.run-heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Write the release version into every manifest
        if: needs.scope.outputs.release == 'true'
        run: node tools/apply-version.mjs ${{ needs.scope.outputs.release-version }}
      - name: Enforce the Rust-only source boundary
        run: npm run check:riir
      - name: Build the Rust UEFI resource required by the Tauri manifest
        run: npm run build:firmware
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Check no_std core
        run: cargo check -p nvstraps-core --no-default-features
      - name: Build native application
        run: npm run tauri:ci
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Inno Setup installer hash mismatch' }
          Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$env:RUNNER_TEMP\InnoSetup7" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\InnoSetup7\ISCC.exe")) { throw 'ISCC.exe was not installed' }
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          & "$env:RUNNER_TEMP\InnoSetup7\ISCC.exe" /Qp "/DAppVersion=$version" "/DOutputDir=..\target\release" installer/NvStrapsReBar.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
      - name: Package the release files
        if: needs.scope.outputs.release == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          foreach ($file in 'NvStrapsReBar.exe', 'NvStrapsReBar.ffs', 'NvStrapsReBar-windows-x64-setup.exe') {
            if ((Get-Item "target/release/$file").Length -eq 0) { throw "$file is empty" }
          }
          Compress-Archive -Path target/release/NvStrapsReBar.exe, target/release/NvStrapsReBar.ffs -DestinationPath release-files/NvStrapsReBar-windows-x64.zip -Force
          Copy-Item target/release/NvStrapsReBar-windows-x64-setup.exe release-files/
          $sums = foreach ($file in 'NvStrapsReBar-windows-x64.zip', 'NvStrapsReBar-windows-x64-setup.exe') {
            "$((Get-FileHash "release-files/$file" -Algorithm SHA256).Hash.ToLower())  $file"
          }
          [System.IO.File]::WriteAllText("$PWD/release-files/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content release-files/SHA256SUMS.txt
      - name: Commit the version, push master and publish the release
        if: needs.scope.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.scope.outputs.release-version }}
          RELEASE_LEVEL: ${{ needs.scope.outputs.release-level }}
        run: node tools/publish-release.mjs
