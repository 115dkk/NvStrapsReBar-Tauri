name: Rust UEFI validation

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  scope:
    name: Decide whether heavy CI is required
    runs-on: ubuntu-latest
    outputs:
      run-heavy: ${{ steps.scope.outputs.run-heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: scope
        name: Classify the change
        env:
          CI_SCOPE_EVENT_NAME: ${{ github.event_name }}
          CI_SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_TEXT: ${{ github.event.pull_request.title || github.event.head_commit.message || '' }}
        run: node tools/ci-scope.mjs

  validate-rust-uefi:
    name: Validate Rust DXE port (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.run-heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Enforce the Rust-only source boundary
        run: npm run check:riir

      - name: Test the portable Rust modules
        run: cargo test -p nvstraps-core -p nvstraps-deploy -p nvstraps-ffs -p nvstraps-uefi --all-targets

      - name: Build, validate, and wrap the Rust boot-service driver
        run: npm run build:firmware

      - name: Reject warnings in host-side firmware tooling
        run: cargo clippy -p nvstraps-ffs -p nvstraps-uefi --all-targets -- -D warnings

      - name: Reject warnings in the UEFI target
        run: cargo clippy -p nvstraps-uefi --release --target x86_64-unknown-uefi -- -D warnings

      - name: Install OVMF and QEMU
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ovmf qemu-system-x86

      - name: Prove automatic dispatch and host-bridge hook installation
        if: runner.os == 'Linux'
        run: npm run test:qemu

      - name: Upload QEMU evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-uefi-qemu-evidence
          path: target/qemu-smoke/
          if-no-files-found: error
