name: Release

# A master push runs no tests again. The pull request that was merged as the push already ran the
# validation workflows, and tools/release-gate.mjs releases only a tree those runs tested.
on:
  push:
    branches: ["master"]

permissions:
  contents: read

# Master pushes queue behind each other so two releases never race for the same version.
concurrency:
  group: master-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release and check its pull request
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      release-level: ${{ steps.release.outputs.level }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: release
        name: Plan the release
        env:
          RELEASE_PLAN_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PLAN_REF: ${{ github.ref }}
          RELEASE_PLAN_BASE_SHA: ${{ github.event.before }}
          RELEASE_PLAN_HEAD_SHA: ${{ github.sha }}
        run: node tools/release-plan.mjs
      - name: Require the merged pull request's checks for this tree
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-gate.mjs

  release:
    name: Build and publish the release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Write the release version into every manifest
        run: node tools/apply-version.mjs ${{ needs.plan.outputs.release-version }}
      - name: Locate OpenSSL for the EFI signer
        shell: pwsh
        run: |
          # The signer builds Authenticode itself and asks OpenSSL only for the RSA signature.
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) { $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe' }
          & $openssl version
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL is unavailable at $openssl" }
          "NVSTRAPS_OPENSSL=$openssl" >> $env:GITHUB_ENV
      - name: Require the UEFI signing key
        shell: pwsh
        env:
          NVSTRAPS_UEFI_SIGNING_KEY: ${{ secrets.NVSTRAPS_UEFI_SIGNING_KEY }}
        run: |
          # Users enrol secure-boot/NvStrapsReBar-db.cer in db; an unsigned release would not run for them.
          if (-not $env:NVSTRAPS_UEFI_SIGNING_KEY) { throw 'The NVSTRAPS_UEFI_SIGNING_KEY secret is missing' }
      - name: Build the UEFI resources required by the Tauri manifest, signing the external EFI programs
        env:
          NVSTRAPS_UEFI_SIGNING_KEY: ${{ secrets.NVSTRAPS_UEFI_SIGNING_KEY }}
        run: npm run build:firmware
      - name: Build native application
        env:
          NVSTRAPS_UEFI_SIGNING_KEY: ${{ secrets.NVSTRAPS_UEFI_SIGNING_KEY }}
        run: npm run tauri:ci
      - name: Build external EFI applications and packaging tool
        run: npm run build:external
      - name: Check the shipped EFI programs carry the project signature
        shell: pwsh
        run: |
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path secure-boot/NvStrapsReBar-db.cer))
          foreach ($name in 'NvStrapsDiagnostic.efi', 'NvStrapsLoader.efi') {
            $image = "target/release/external/$name"
            & target/release/external/nvstraps-external-tool.exe check-signed $image secure-boot/NvStrapsReBar-db.cer
            if ($LASTEXITCODE -ne 0) { throw "$name is not signed with the project certificate" }
            # Windows checks the RSA signature independently; the self-signed root is not trusted here.
            $signature = Get-AuthenticodeSignature -FilePath $image
            if ($signature.Status -notin 'Valid', 'UnknownError', 'NotTrusted' -or $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "$name: Windows reports $($signature.Status) ($($signature.StatusMessage)) signed by $($signature.SignerCertificate.Thumbprint)"
            }
            "$name signed by $($certificate.Subject): $($signature.Status)"
          }
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Package the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          foreach ($file in 'NvStrapsReBar.exe', 'NvStrapsReBar.ffs', 'NvStrapsReBar-windows-x64-setup.exe') {
            if ((Get-Item "target/release/$file").Length -eq 0) { throw "$file is empty" }
          }
          Compress-Archive -Path target/release/NvStrapsReBar.exe, target/release/NvStrapsReBar.ffs, target/release/external -DestinationPath release-files/NvStrapsReBar-windows-x64.zip -Force
          Copy-Item target/release/NvStrapsReBar-windows-x64-setup.exe release-files/
          $sums = foreach ($file in 'NvStrapsReBar-windows-x64.zip', 'NvStrapsReBar-windows-x64-setup.exe') {
            "$((Get-FileHash "release-files/$file" -Algorithm SHA256).Hash.ToLower())  $file"
          }
          [System.IO.File]::WriteAllText("$PWD/release-files/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content release-files/SHA256SUMS.txt
      - name: Commit the version, push master and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.release-version }}
          RELEASE_LEVEL: ${{ needs.plan.outputs.release-level }}
        run: node tools/publish-release.mjs
