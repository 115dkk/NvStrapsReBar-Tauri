name: Release

# A master push runs no tests again. The pull request that was merged as the push already ran the
# validation workflows, and tools/release-gate.mjs releases only a tree those runs tested.
#
# One release carries the Windows files and the Linux packages. The two builds run side by side
# from the pushed commit with the release version written in, and hand their files to the publish
# job, which pushes the version commit and creates the release only when both arrived. The apt
# and dnf repositories are then published again with the new packages in them.
on:
  push:
    branches: ["master"]

permissions:
  contents: read

# Master pushes queue behind each other so two releases never race for the same version.
concurrency:
  group: master-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release and check its pull request
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      release-level: ${{ steps.release.outputs.level }}
      release-version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: release
        name: Plan the release
        env:
          RELEASE_PLAN_EVENT_NAME: ${{ github.event_name }}
          RELEASE_PLAN_REF: ${{ github.ref }}
          RELEASE_PLAN_BASE_SHA: ${{ github.event.before }}
          RELEASE_PLAN_HEAD_SHA: ${{ github.sha }}
        run: node tools/release-plan.mjs
      - name: Require the merged pull request's checks for this tree
        if: steps.release.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release-gate.mjs

  windows:
    name: Build the Windows files
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install dependencies
        run: npm ci
      - name: Write the release version into every manifest
        run: node tools/apply-version.mjs ${{ needs.plan.outputs.release-version }}
      - name: Locate OpenSSL for the EFI signer
        shell: pwsh
        run: |
          # The signer builds Authenticode itself and asks OpenSSL only for the RSA signature.
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) { $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe' }
          & $openssl version
          if ($LASTEXITCODE -ne 0) { throw "OpenSSL is unavailable at $openssl" }
          "NVSTRAPS_OPENSSL=$openssl" >> $env:GITHUB_ENV
      - name: Require the UEFI signing key
        shell: pwsh
        env:
          NVSTRAPS_UEFI_SIGNING_KEY: ${{ secrets.NVSTRAPS_UEFI_SIGNING_KEY }}
        run: |
          # Users enrol secure-boot/NvStrapsReBar-db.cer in db; an unsigned release would not run for them.
          if (-not $env:NVSTRAPS_UEFI_SIGNING_KEY) { throw 'The NVSTRAPS_UEFI_SIGNING_KEY secret is missing' }
      - name: Build the UEFI resources required by the Tauri manifest, signing the external EFI programs
        env:
          NVSTRAPS_UEFI_SIGNING_KEY: ${{ secrets.NVSTRAPS_UEFI_SIGNING_KEY }}
        run: npm run build:firmware
      - name: Build native application
        env:
          NVSTRAPS_UEFI_SIGNING_KEY: ${{ secrets.NVSTRAPS_UEFI_SIGNING_KEY }}
        run: npm run tauri:ci
      - name: Build external EFI applications and packaging tool
        run: npm run build:external
      - name: Check the shipped EFI programs carry the project signature
        shell: pwsh
        run: ./scripts/check-efi-signatures.ps1 -Certificate secure-boot/NvStrapsReBar-db.cer -Images target/release/external/NvStrapsDiagnostic.efi, target/release/external/NvStrapsLoader.efi
      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: Package the release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-files | Out-Null
          foreach ($file in 'NvStrapsReBar.exe', 'NvStrapsReBar.ffs', 'NvStrapsReBar-windows-x64-setup.exe') {
            if ((Get-Item "target/release/$file").Length -eq 0) { throw "$file is empty" }
          }
          Compress-Archive -Path target/release/NvStrapsReBar.exe, target/release/NvStrapsReBar.ffs, target/release/external -DestinationPath release-files/NvStrapsReBar-windows-x64.zip -Force
          Copy-Item target/release/NvStrapsReBar-windows-x64-setup.exe release-files/
          Get-ChildItem release-files
      - name: Hand the files to the publish job
        # Kept for a day: the publish job of this run is their only reader.
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-files/
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build, sign and check the Linux packages
    needs: plan
    if: needs.plan.outputs.release == 'true'
    # The oldest supported Ubuntu, so the packages also run on everything newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Require the rpm signing key
        env:
          NVSTRAPS_RPM_SIGNING_KEY: ${{ secrets.NVSTRAPS_RPM_SIGNING_KEY }}
        run: |
          # rpm on Fedora refuses a package without a signature, so an unsigned one is not
          # published. Asked for here, before the build spends its time.
          if [ -z "${NVSTRAPS_RPM_SIGNING_KEY}" ]; then
            echo "The NVSTRAPS_RPM_SIGNING_KEY secret is missing" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install the WebKitGTK development packages and the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev rpm gnupg xvfb
      - name: Install dependencies
        run: npm ci
      - name: Write the release version into every manifest
        run: node tools/apply-version.mjs ${{ needs.plan.outputs.release-version }}
      - name: Build the application and its deb and rpm packages
        run: npm run build:linux-packages
      - name: Sign the rpm with the project key and verify the signature
        # Only this step sees the key: the build above runs other people's build scripts.
        env:
          NVSTRAPS_RPM_SIGNING_KEY: ${{ secrets.NVSTRAPS_RPM_SIGNING_KEY }}
        run: bash scripts/sign-linux-rpm.sh
      - name: Check the packages, install the deb and start the application
        run: npm run check:linux-packages -- --install
      - name: Collect the packages
        run: |
          mkdir release-files
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm release-files/
          ls -l release-files
      - name: Hand the packages to the publish job
        # Kept for a day: the publish job of this run is their only reader.
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release-files/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Commit the version, push master and publish the release
    needs: [plan, windows, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rpm, which checks the package signature once more
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm
      - name: Write the release version into every manifest
        # The same rewrite both builds made, so the commit below is the tree they were built from.
        run: node tools/apply-version.mjs ${{ needs.plan.outputs.release-version }}
      - name: Receive the files of both builds
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Commit the version, push master and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.plan.outputs.release-version }}
        run: node tools/publish-release.mjs

  repository:
    name: Publish the apt and dnf repositories with the new packages
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/LinuxRepository.yml
    secrets:
      NVSTRAPS_RPM_SIGNING_KEY: ${{ secrets.NVSTRAPS_RPM_SIGNING_KEY }}
