[package]
name = "nvstraps-external-tool"
version = "1.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
der = { version = "=0.8.2", features = ["alloc"] }
nvstraps-external = { path = "../nvstraps-external" }
nvstraps-ffs = { path = "../nvstraps-ffs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
x509-cert = { version = "=0.3.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

