[package]
name = "nvstraps-linux-helper"
version = "1.1.6"
description = "Root helper that writes the NvStrapsReBar EFI variable on Linux"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nvstraps-rebar-helper"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nvstraps-core = { path = "../nvstraps-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
