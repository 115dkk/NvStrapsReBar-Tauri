[package]
name = "nvstraps-uefi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "NvStrapsReBar"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nvstraps-core = { path = "../nvstraps-core", default-features = false }

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.39.0", features = ["alloc", "global_allocator", "panic_handler"] }
